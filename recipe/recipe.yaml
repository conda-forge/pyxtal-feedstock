schema_version: 1

context:
  name: pyxtal
  version: "1.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyxtal-${{ version }}.tar.gz
  sha256: c092697939bd82a2bfe13f2dab289c645b27f2283d1919898495485f18ede710

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - spglib >=2.5.0
    - pymatgen >=2024.3.1
    - pandas >=2.0.2
    - networkx >=2.3
    - ase >=3.23.0
    - scipy >=1.7.3
    - vasprun-xml >=1.0.4
    - importlib-metadata >=1.4
    - typing_extensions >=4.12
    - pyocse >=0.1.1
    - psutil

tests:
  - python:
      imports:
        - pyxtal
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python code for generation of crystal structures based on symmetry constraints.
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/qzhu2017/PyXtal

extra:
  recipe-maintainers:
    - jan-janssen
